# ============================================================
# ToyVerse Cloud — Nginx 反向代理配置
#
# 适用场景：需要独立 Nginx 前置（TLS 终止、多实例负载均衡、
#           静态资源 CDN 加速）时使用。
#
# 若不需要 Nginx，可直接用应用内置静态托管：
#   make dev  →  http://localhost:8000/platform/
# ============================================================

upstream toyverse_backend {
    server app:8000;
    keepalive 32;
}

# HTTP 重定向到 HTTPS（生产环境启用）
# server {
#     listen 80;
#     server_name your-domain.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 64m;   # 知识库文件与 OTA 固件包上传
    server_tokens off;

    # ----------------------------------------------------------
    # 安全响应头
    # ----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------
    # API 反向代理
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://toyverse_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 对话流式响应：关闭缓冲，避免首字延迟被放大
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ----------------------------------------------------------
    # WebSocket 对话端点（需要 Upgrade 头，单独配置）
    # ----------------------------------------------------------
    # ★ 路径是 `/ws/miniapp/chat`，**不在** `/api/v1` 前缀下：
    # 设备侧/小程序侧的 WebSocket 独立于版本化的 REST 前缀（见
    # `app/realtime/ws_chat.py` 的 `@router.websocket("/ws/miniapp/chat")`
    # 与 `app/main.py` 里不带 prefix 的 include_router）。
    # 曾经这里写的是 `/api/v1/ws/`——那两个前缀都不匹配，握手请求会落到
    # 下面的 SPA 回退并返回 **HTML**，客户端只能看到「连接意外关闭」，
    # 排查时极易误判为前端 bug。
    location /ws/ {
        proxy_pass         http://toyverse_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------
    # API 交互式文档
    # ----------------------------------------------------------
    location /docs {
        proxy_pass       http://toyverse_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://toyverse_backend;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------
    # 前端静态资源
    # ----------------------------------------------------------
    root /app/frontend;
    index index.html;

    # ----------------------------------------------------------
    # 静态资源缓存策略
    # ----------------------------------------------------------
    # ★ 本项目**前端零构建、文件名不含内容哈希**（`main.js` 就是 `main.js`），
    # 因此**不能**对 JS/CSS 声明 `immutable` 长缓存：那会让发版后老用户的
    # 浏览器继续执行旧代码，且没有任何办法让它失效（文件名没变、URL 也没变）。
    # 正确策略是 `no-cache`（= 每次回源校验，命中 ETag 则 304）：
    # 与后端 `StaticFiles` 挂载时的策略一致（见 `app/main.py` 的说明）。
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # 图片 / 字体 / 音视频：内容随发版基本不变，可以长缓存
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # HTML：不缓存，保证发版后立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 四端入口：**每端各自回退到自己的 index.html**。
    #
    # 本项目用 hash 路由（`#/tenants/t-001`），浏览器不会把 hash 发给服务端，
    # 因此「深链接刷新」实际请求的是入口路径本身——这正是必须逐端回退的原因。
    # 若统一回退到根 index.html，从商户端深链接刷新会跳到**登录页**，
    # 用户看到的是「刷新一下就被登出了」（登录页按角色再分发）。
    location /platform/ { try_files $uri $uri/ /platform/index.html; }
    location /merchant/ { try_files $uri $uri/ /merchant/index.html; }
    location /factory/  { try_files $uri $uri/ /factory/index.html; }
    location /miniapp/  { try_files $uri $uri/ /miniapp/index.html; }

    # 共享模块（四端共用）：`/shared/...` 在容器内即 `/app/frontend/shared/...`
    location /shared/ { try_files $uri =404; }

    # 入口与登录页：**应用路由**（不是磁盘上的文件），必须交给后端。
    #
    # 为什么不能靠 `try_files`：`/login` 由 FastAPI 显式提供
    # （见 `app/main.py` 的 `login_page_route`），磁盘上并没有名为 `login` 的文件，
    # 因此 nginx 会直接 404——而 `make dev` 下它明明是好的。
    # 这类「本地好、经代理就坏」的差异必须在代理层补齐（实测踩到）。
    # `/` 保留 302 到 /platform/：入口语义由代理层决定，少一次后端往返。
    location = / {
        return 302 /platform/;
    }

    location = /login {
        proxy_pass         http://toyverse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass       http://toyverse_backend/api/v1/health;
        access_log off;
    }
}

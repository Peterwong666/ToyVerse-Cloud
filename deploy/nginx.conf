# ============================================================
# ToyVerse Cloud — Nginx 反向代理配置
#
# 适用场景：需要独立 Nginx 前置（TLS 终止、多实例负载均衡、
#           静态资源 CDN 加速）时使用。
#
# 若不需要 Nginx，可直接用应用内置静态托管：
#   make dev  →  http://localhost:8000/platform/
# ============================================================

upstream toyverse_backend {
    server app:8000;
    keepalive 32;
}

# HTTP 重定向到 HTTPS（生产环境启用）
# server {
#     listen 80;
#     server_name your-domain.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 64m;   # 知识库文件与 OTA 固件包上传
    server_tokens off;

    # ----------------------------------------------------------
    # 安全响应头
    # ----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------
    # API 反向代理
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://toyverse_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 对话流式响应：关闭缓冲，避免首字延迟被放大
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ----------------------------------------------------------
    # WebSocket 对话端点（需要 Upgrade 头，单独配置）
    # ----------------------------------------------------------
    location /api/v1/ws/ {
        proxy_pass         http://toyverse_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------
    # API 交互式文档
    # ----------------------------------------------------------
    location /docs {
        proxy_pass       http://toyverse_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://toyverse_backend;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------
    # 前端静态资源
    # ----------------------------------------------------------
    root /app/frontend;
    index index.html;

    # 带哈希指纹的资源：长期强缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML：不缓存，保证发版后立即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 四端入口
    location /platform/ { try_files $uri $uri/ /platform/index.html; }
    location /merchant/ { try_files $uri $uri/ /merchant/index.html; }
    location /factory/  { try_files $uri $uri/ /factory/index.html; }
    location /miniapp/  { try_files $uri $uri/ /miniapp/index.html; }

    location = / {
        return 302 /platform/;
    }

    location /health {
        proxy_pass       http://toyverse_backend/api/v1/health;
        access_log off;
    }
}

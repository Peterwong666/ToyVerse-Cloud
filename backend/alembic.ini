# ============================================================
# Alembic 配置
#
# 用法（在 backend/ 目录下执行）：
#   ../backend/.venv/bin/alembic upgrade head       # 迁移到最新
#   ../backend/.venv/bin/alembic downgrade -1       # 回滚一版
#   ../backend/.venv/bin/alembic revision --autogenerate -m "描述"
#
# 或使用 Makefile：
#   make migrate / make downgrade / make migration m="描述"
#
# 数据库连接串不在此硬编码，由 alembic/env.py 从应用配置读取。
# ============================================================

[alembic]
script_location = alembic

# 迁移文件命名带时间前缀，保证顺序稳定
file_template = %%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 版本目录（相对 script_location）
version_locations = alembic/versions

# 不在迁移中生成 SQLAlchemy 的 info 输出
truncate_slug_length = 60

# prepend_sys_path: 让 alembic 能 import app 包
prepend_sys_path = .

# 迁移时使用的数据库 URL 由 env.py 注入，这里留空
sqlalchemy.url =


# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

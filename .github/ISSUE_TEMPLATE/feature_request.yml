name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述使用场景中遇到的痛点（先讲问题，再讲方案）
      placeholder: 例如：工厂端无法按批次导出烧录记录，月末对账要手工整理……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你期望的行为或接口形态；涉及 API 变更可给出示例请求/响应
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他解法？为什么倾向上面的方案？

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 实现该功能（请先读 CONTRIBUTING.md）

# ============================================================
# Dependabot — 依赖更新机制（只建 PR，不自动合并）
#
# 覆盖两个 ecosystem：
#   pip            —— backend/requirements*.txt（FastAPI / SQLAlchemy 等）
#   github-actions —— .github/workflows/ 里的 actions/* 版本
#
# 更新 PR 仍会过完整 CI（lint / mypy / pytest / 契约 / 文档一致性），
# 升级与否由人评审决定——本文件只解决「没人盯着依赖过期」的问题。
# ============================================================

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
